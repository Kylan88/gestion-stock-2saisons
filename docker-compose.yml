services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 2saisons-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://2saisons_user:${POSTGRES_PASSWORD:-2saisons_secret_2026}@db:5432/2saisons_stock
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: 2saisons-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: 2saisons-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: 2saisons_stock
      POSTGRES_USER: 2saisons_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2saisons_secret_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2saisons_user -d 2saisons_stock"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
